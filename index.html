<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六月的歌 - VTuber Live Music</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 引入 CSV, Supabase 和 撒花特效 依赖库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body ontouchstart="">
    <div class="bg-overlay"></div>

    <header>
        <div class="avatar-wrapper" onclick="playAvatarAnim()">
            <img src="assets/avatar.jpg" alt="Avatar" class="avatar" id="avatarImg">
        </div>
        <div class="vtuber-title">六月的歌</div>
        <div id="totalCount" class="total-count"># 收录曲目正在清点中...</div>
        <div class="vtuber-bio">欢迎点歌，点击任意卡片即可自动复制点歌指令</div>
        
        <div class="btn-group">
            <a href="#" target="_blank" class="btn" id="liveBtn">直播间</a>
            <a href="#" target="_blank" class="btn" id="spaceBtn">个人主页</a>
            <button class="btn" onclick="pickRandomSong()">随便听听</button>
            <!-- 新增许愿按钮 -->
            <button class="btn btn-wish" onclick="openWishModal()">✨ 许愿池</button>
        </div>
    </header>

    <!-- 新增：忍者绘马墙展示区 -->
    <div class="wish-board-section">
        <div class="section-title">⛩️ 忍者绘马墙 (最新许愿)</div>
        <div class="ema-grid" id="emaBoard">
            <!-- JS 会在这里生成 8 个绘马 -->
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">正在沟通神明...</div>
        </div>
    </div>

    <!-- 原有：筛选面板 -->
    <div class="filter-panel" id="filterPanel">
        <input type="text" id="searchInput" class="search-bar" placeholder="搜索歌名、原唱、曲风..." oninput="handleSearch()">
        <div class="filter-row">
            <label style="font-size:12px; color:var(--text-sub);">分类筛选：</label>
            <select id="genreSelect" onchange="applyFilters()"><option value="all">所有曲风</option></select>
            <select id="artistSelect" onchange="applyFilters()"><option value="all">所有歌手</option></select>
        </div>
        <div class="initials-bar" id="initialsBar"></div>
    </div>

    <!-- 原有：歌曲列表 -->
    <div class="song-container" id="songList"></div>
    <div class="pagination" id="pagination"></div>

    <!-- 许愿弹窗 -->
    <div class="modal" id="makeWishModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--primary)">⛩️ 挂上许愿绘马</h3>
            <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 15px;">每天只能许愿一次哦，主播会挑选合适的练习~</p>
            <input type="text" id="wishSong" class="wish-input" placeholder="想听的歌名 (必填，限12字)" maxlength="12">
            <input type="text" id="wishSinger" class="wish-input" placeholder="原唱是谁？(选填)" maxlength="12">
            <input type="text" id="wishName" class="wish-input" placeholder="你的昵称 (选填)" maxlength="10">
            
            <div class="btn-group" style="justify-content: center; margin-top: 15px;">
                <button class="btn btn-wish" onclick="submitWish()" id="submitWishBtn">奉纳许愿</button>
                <button class="btn" style="background: #f0f0f0; border-color: #e0e0e0; color: #666;" onclick="closeWishModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 随便听听弹窗 -->
    <div class="modal" id="randomModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--primary)">今日幸运曲目</h3>
            <div id="randomResult" style="font-size: 18px; font-weight: bold; margin: 20px 0; color: var(--text-dark);"></div>
            <div id="randomMeta" style="font-size: 13px; color: var(--text-sub); margin-bottom: 20px;"></div>
            <div class="btn-group" style="justify-content: center;">
                <button class="btn" style="background: var(--primary); color: white; border-color: var(--primary);" onclick="copyRandomSong()">一键点歌</button>
                <button class="btn" style="background: #f0f0f0; border-color: #e0e0e0; color: #666;" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <div id="toast">提示信息</div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
